<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="Game_style.css">
</head>
<body>
    <div class="container">
        <h1>PONG GAME</h1>
        <div class="scoreboard">
            <div class="score">
                <span class="label">Player</span>
                <span id="playerScore" class="score-value">0</span>
            </div>
            <div class="score">
                <span class="label">Computer</span>
                <span id="computerScore" class="score-value">0</span>
            </div>
        </div>
        
        <canvas id="pongCanvas" width="800" height="400"></canvas>
        
        <div class="controls">
            <p>Controls:</p>
            <p>🖱️ Mouse - Move paddle up/down</p>
            <p>⬆️⬇️ Arrow Keys - Move paddle up/down</p>
            <p>SPACE - Start/Pause game</p>
        </div>
    </div>
    
    <script src="Game.js"></script>
</body>
</html>
